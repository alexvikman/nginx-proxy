# Example: proxy plus one routed service with an automatic certificate.
services:
  proxy:
    image: ghcr.io/alexvikman/nginx-proxy:latest
    ports:
      - "80:80"
      - "443:443"
    environment:
      DEFAULT_EMAIL: ops@example.com
      TRUST_DOWNSTREAM_PROXY: "false"
    volumes:
      - /var/run/docker.sock:/tmp/docker.sock:ro
      - certs:/etc/nginx/certs
      - vhost:/etc/nginx/vhost.d
    restart: unless-stopped

  whoami:
    image: traefik/whoami
    environment:
      VIRTUAL_HOST: whoami.example.com
      LETSENCRYPT_HOST: whoami.example.com

volumes:
  certs:
  vhost:
